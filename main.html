<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
        }
        .container{
            padding: 40px;
            background-color: #f5f5f5;
        }
        .testinomial{
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            background-color: white;
        }
        .text{
            font-size: 16px;
            line-height: 1.5;
        }
        .author{
            text-align: right;
            font-style: italic;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="testinomial">
            <p class="text">
                "This is an amazing service. I am very happy with the experience."
            </p>
            <p class="author">-John Doe</p>
        </div>

        <div class="testinomial">
            <p class="text">
                "The team was very helpful and professional. Highly recommended!"
            </p>
            <p class="author">-Jane Smith</p>
        </div>
    </div>
    
</body>
</html>
